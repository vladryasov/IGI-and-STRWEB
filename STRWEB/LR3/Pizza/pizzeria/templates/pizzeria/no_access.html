{% extends 'base.html' %}
{% load static %}

{% block title %}Нет доступа - Pizzeria{% endblock %}

{% block content %}
<article style="text-align: center; padding: 4rem 2rem;">
    <h1 style="color: var(--error, #e74c3c); margin-bottom: 2rem;">🚫 Доступ запрещен</h1>
    <div style="max-width: 600px; margin: 0 auto; background: var(--bg-white, #fff); padding: 2rem; border-radius: 12px; box-shadow: var(--shadow-md);">
        <p style="font-size: 1.2rem; margin-bottom: 2rem; color: var(--text-dark, #333);">{{ message }}</p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'home' %}" class="btn" style="display: inline-block; padding: 0.75rem 2rem; background: var(--primary, #ff6b35); color: white; text-decoration: none; border-radius: 4px; font-weight: 600;">Вернуться на главную</a>
            {% if not request.user.is_authenticated %}
                <a href="{% url 'login' %}" class="btn" style="display: inline-block; padding: 0.75rem 2rem; background: var(--primary-dark, #e55a2b); color: white; text-decoration: none; border-radius: 4px; font-weight: 600;">Войти в систему</a>
            {% endif %}
        </div>
    </div>
</article>
{% endblock %}
